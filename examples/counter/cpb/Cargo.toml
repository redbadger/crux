[package]
name = "cpb-counter"
version = "0.1.0"
edition = "2024"
publish = false
description = "spike(no_std): the counter example's shell for the Adafruit Circuit Playground Bluefruit, as firmware"

# Its own workspace, excluded from the counter's: it builds for another target with its own
# profile, and feature unification with the std shells would pull std into the firmware.
[workspace]

[dependencies]
# The counter's core, without std.
shared = { path = "../shared", default-features = false }
# Without std, crux_core's internal locks are critical sections; cortex-m provides them below.
crux_core = { path = "../../../crux_core", default-features = false, features = ["critical-section"] }

embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread"] }
embassy-futures = "0.1.2"
embassy-nrf = { version = "0.11", features = ["nrf52840", "time-driver-rtc1", "gpiote", "time"] }
embassy-time = "0.5.1"

cortex-m = { version = "0.7.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.5"
embedded-alloc = "0.7"
panic-halt = "1.0"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
debug = 2          # symbols in the ELF only; not in the flashed image
incremental = false

[profile.dev]
opt-level = "s"
