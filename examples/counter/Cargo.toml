[workspace]
members = [
    "ffi",
    "shared",
    "tauri/src-tauri",
    "tui",
    "web-dioxus",
    "web-leptos",
    "web-yew",
]
# the embedded shell builds for another target, in its own workspace
exclude = ["cpb"]
resolver = "3"

[workspace.package]
authors = ["Red Badger Consulting Limited"]
edition = "2024"
repository = "https://github.com/redbadger/crux/"
license = "Apache-2.0"
keywords = ["crux", "crux_core", "cross-platform-ui", "ffi", "wasm"]
rust-version = "1.90"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
empty_docs = "allow"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
anyhow = "1.0.104"
boltffi = "=0.30.1"
# No default features, so `shared` can be built without `std`. `shared`'s
# own `std` feature (on by default) turns them back on.
crux_core = { path = "../../crux_core", default-features = false, features = ["crux_macros"] }
facet = { version = "=0.46.5", default-features = false, features = ["alloc"] }
serde = { version = "1.0.229", default-features = false, features = ["alloc"] }

[profile]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
