<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>CPB Gateway</title>
        <style>
            :root { --bg: #fff; --fg: #111; --muted: #666; --line: #ddd; }
            @media (prefers-color-scheme: dark) {
                :root { --bg: #111; --fg: #eee; --muted: #999; --line: #333; }
            }
            body { background: var(--bg); color: var(--fg); margin: 0;
                   font: 15px/1.45 system-ui, sans-serif; }
            main { max-width: 760px; margin: 0 auto; padding: 16px; }
            h1 { margin: 0 0 4px; font-size: 1.4rem; }
            .muted, .stats { color: var(--muted); }
            .status { display: flex; gap: 12px; align-items: center; }
            button { font: inherit; padding: 6px 14px; }
            .log { font: 13px/1.5 ui-monospace, monospace; border-top: 1px solid var(--line);
                   padding: 8px 0 0; margin: 0; list-style: none; overflow-wrap: anywhere; }
        </style>
    </head>
    <body></body>
</html>
