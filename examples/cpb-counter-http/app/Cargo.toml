[package]
name = "cpb-counter-http-app"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "spike(no_std): counter_http's Crux app, ported to no_std for the CPB"

[dependencies]
cpb-protocol = { path = "../protocol" }
crux_core = { path = "../../../crux_core", default-features = false, features = ["crux_macros"] }
crux_http = { path = "../../../crux_http", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
url = { version = "2.5.8", default-features = false }

[dev-dependencies]
crux_core = { path = "../../../crux_core", features = ["testing"] }

[lints]
workspace = true
