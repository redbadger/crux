# Host workspace for the parts that test on the host: the app and the heap probe.
# `firmware/` (thumbv7em) is a separate workspace with its own build target, and uses the
# app by path. The BLE wire protocol and the Chrome gateway are app-agnostic, so they live in
# `examples_support/ble_protocol` and `examples_support/ble_gateway`.
[workspace]
members = ["app", "heap-probe"]
exclude = ["firmware"]
resolver = "3"

[workspace.package]
edition = "2024"
publish = false

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
