[package]
name = "cpb-counter-heap-probe"
version = "0.1.0"
edition = "2024"
publish = false
description = "spike(no_std): run the cpb-counter core on the host, no_std crux_core, and measure peak heap"

[workspace]

[dependencies]
# Same features as the firmware: no std in crux_core (critical-section locks, internal channel).
crux_core = { path = "../../../crux_core", default-features = false, features = ["crux_macros", "critical-section"] }
# no_std crux_core takes critical sections; on the host, use the std implementation.
critical-section = { version = "1.2", features = ["std"] }
facet = { version = "=0.46.5", default-features = false, features = ["alloc"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
