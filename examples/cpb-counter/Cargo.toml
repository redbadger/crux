[package]
name = "cpb-counter"
version = "0.1.0"
edition = "2024"
publish = false
description = "spike(no_std): a Crux counter as firmware for the Adafruit Circuit Playground Bluefruit"

# Standalone: not part of the crux workspace (different target, its own profile).
[workspace]

[dependencies]
crux_core = { path = "../../crux_core", default-features = false, features = ["crux_macros"] }
facet = { version = "=0.46.5", default-features = false, features = ["alloc"] }

embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread"] }
embassy-futures = "0.1.2"
embassy-nrf = { version = "0.11", features = ["nrf52840", "time-driver-rtc1", "gpiote", "time"] }
embassy-time = "0.5.1"

cortex-m = { version = "0.7.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.5"
embedded-alloc = "0.7"
panic-halt = "1.0"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
debug = 2          # symbols in the ELF only; not in the flashed image
incremental = false

[profile.dev]
opt-level = "s"
