[package]
name = "web-leptos"
version = "0.1.0"
authors.workspace = true
repository.workspace = true
edition.workspace = true
license.workspace = true
keywords.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
console_error_panic_hook = "0.1.7"
console_log = "1.1.0"
crux_core.workspace = true
crux_time.workspace = true
futures-util = "0.3.33"
gloo-net = { version = "0.7.0", features = ["http"] }
gloo-timers = { version = "0.4", features = ["futures"] }
js-sys = "0.3.103"
log = "0.4.33"
shared = { path = "../shared" }
wasm-bindgen = "0.2.126"
wasm-bindgen-futures = "0.4.76"
web-sys = { version = "0.3.103", features = ["Geolocation", "Navigator", "Position", "Coordinates", "Storage", "Window"] }

leptos = { version = "0.8.20", features = ["csr"] }
phosphor-leptos = "0.8.0"

[lints.clippy]
empty_docs = "allow"
