[package]
name = "cpb-counter-http-heap-probe"
version = "0.1.0"
edition = "2024"
publish = false
description = "spike(no_std): run the counter-http core on the host, no_std crux_core/crux_http/crux_time, and measure peak heap"

[workspace]

[dependencies]
# Same features as the firmware: the counter-http core and crux_core without std
# (critical-section locks, internal channel).
shared = { path = "../../shared", default-features = false }
ble_protocol = { path = "../../../../examples_support/ble_protocol" }
crux_core = { path = "../../../../crux_core", default-features = false, features = ["critical-section"] }
# no_std crux_core takes critical sections; on the host, use the std implementation.
critical-section = { version = "1.2", features = ["std"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
