[package]
name = "shared_ffi"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true

[lib]
crate-type = ["cdylib", "staticlib"]

[[bin]]
name = "codegen"
required-features = ["codegen"]

[features]
facet_typegen = ["shared/facet_typegen"]
codegen = [
    "dep:anyhow",
    "dep:clap",
    "dep:crux_http",
    "dep:crux_time",
    "dep:log",
    "dep:pretty_env_logger",
    "facet_typegen",
]

[dependencies]
boltffi.workspace = true
crux_core = { workspace = true, features = ["bridge"] }
shared = { path = "../shared" }

# optional dependencies
anyhow = { workspace = true, optional = true }
clap = { version = "4.6.6", optional = true, features = ["derive"] }
crux_http = { workspace = true, optional = true }
crux_time = { workspace = true, optional = true }
log = { version = "0.4.33", optional = true }
pretty_env_logger = { version = "0.5.0", optional = true }

[lints]
workspace = true
