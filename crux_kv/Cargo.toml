[package]
name = "crux_kv"
version = "0.15.0"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Key-Value capability for use with crux_core"
readme = "README.md"
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
crux_core = { version = "0.21.0", path = "../crux_core", default-features = false, features = ["crux_macros"] }
facet.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_bytes = "0.11"
thiserror.workspace = true

[dev-dependencies]
anyhow.workspace = true
crux_core = { version = "0.21.0", path = "../crux_core", features = [
    "testing",
] }
serde_json = "1.0.151"

[features]
default = ["std"]
# crux_kv uses `std` itself. This feature forwards it to crux_core, so a
# dependent crate no longer gets crux_core's default features through crux_kv.
std = ["crux_core/std"]
facet_typegen = ["crux_core/facet_typegen"]

[lints]
workspace = true
