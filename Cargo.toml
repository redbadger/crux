[workspace]
resolver = "3"
members = [
    "crux_core",
    "crux_http",
    "crux_kv",
    "crux_macros",
    "crux_time",
    "doctest_support",
    "examples_support/api_server",
]

[workspace.package]
authors = ["Red Badger Consulting Limited"]
edition = "2024"
rust-version = "1.90"
repository = "https://github.com/redbadger/crux/"
license = "Apache-2.0"
keywords = ["cross-platform-ui", "crux", "crux_core", "ffi", "wasm"]

[workspace.dependencies]
anyhow = "1.0"
facet = "=0.46.5"
# TEMPORARY: facet_generate 0.19.0 and facet-generate-attrs 0.18.0 are not on
# crates.io yet — see https://github.com/redbadger/facet-generate/pull/117.
# These path deps let `just ci` run in the meantime. Swap the two lines below
# back to the registry versions before publishing: `cargo publish` cannot
# resolve a path dependency outside this workspace.
# facet_generate = "0.19"
# facet-generate-attrs = "0.18"
facet_generate = { path = "../facet-generate/crates/facet_generate" }
facet-generate-attrs = { path = "../facet-generate/crates/facet-generate-attrs" }
serde = "1.0"
thiserror = "2.0"
uniffi_bindgen = "=0.29.4"
boltffi = "=0.29.3"

[workspace.lints.clippy]
pedantic = "warn"
nursery = "warn"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
split-debuginfo = "unpacked"
