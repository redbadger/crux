[workspace]
resolver = "3"
members = [
    "crux_core",
    "crux_http",
    "crux_kv",
    "crux_macros",
    "crux_time",
    "doctest_support",
    "examples_support/api_server",
]
# The examples are workspaces of their own. Excluding them matters when one of
# their crates is a path dependency of a third workspace (an embedded shell):
# Cargo would otherwise resolve its `workspace = true` keys against this root.
exclude = ["examples"]

[workspace.package]
authors = ["Red Badger Consulting Limited"]
edition = "2024"
rust-version = "1.90"
repository = "https://github.com/redbadger/crux/"
license = "Apache-2.0"
keywords = ["cross-platform-ui", "crux", "crux_core", "ffi", "wasm"]
categories = ["gui", "wasm", "development-tools::ffi"]

[workspace.dependencies]
anyhow = "1.0"
facet = "=0.46.5"
facet_generate = "0.22.0"
# Must be the same crate instance `facet_generate` itself depends on, so from the
# same source (crates.io) and a version its requirement accepts. A second copy is
# an unrelated `Attr` type: the attribute a `#[facet(fg::namespace = …)]` writes is
# then invisible to the `get_as::<fg::Attr>()` that reads it, and generation fails
# with `bad attribute format`. Patch both together when trying a local checkout.
facet-generate-attrs = "0.18"
# facet_generate = { path = "../facet-generate/crates/facet_generate" }
# facet-generate-attrs = { path = "../facet-generate/crates/facet-generate-attrs" }
serde = "1.0"
thiserror = "2.0"
uniffi_bindgen = "=0.29.4"
boltffi = "=0.30.1"

[workspace.lints.clippy]
pedantic = "warn"
nursery = "warn"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
split-debuginfo = "unpacked"
