<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 721.5" width="920" height="721.5" role="img" aria-labelledby="title desc">
<title id="title">Crux: the effect router in the counter</title>
<desc id="desc">The Rust shared crate holds the EffectRouter and the EffectRoutes type, which implements Routes. The EffectRouter holds the Core, which runs the app, and the routing closure. The Core gives its effects to the routing closure. The closure sends Random to the RngHandler, which runs on its own thread, and everything else to the Serialized lane. The Serialized lane sends bytes to the shell's EffectHandler through the CruxShell callback. The shell is in Swift or Kotlin. The RngHandler sends a RandomNumber back to the Core, and the shell sends the serialized output back to the Core.</desc>
