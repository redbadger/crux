<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 777.5" width="860" height="777.5" role="img" aria-labelledby="title desc">
<title id="title">Crux: middleware in the counter</title>
<desc id="desc">The Rust shared crate holds three nested layers. The Bridge, with BincodeFfiFormat, is on the outside. It holds the MapEffectLayer, which holds the HandleEffectLayer. The HandleEffectLayer holds the Core of the Counter app and the RngMiddleware, which runs on its own thread. The Core sends Random to the RngMiddleware, which sends a RandomNumber back to the Core. Every other effect goes out through the MapEffectLayer, which converts it to an ffi::Effect, and through the Bridge, which serializes it. The bytes go to the EffectHandler in the Swift or Kotlin shell. The bridge returns them from update or resolve, or sends them through the CruxShell callback. The shell sends the serialized output back in through the layers to the Core.</desc>
