<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 721.5" width="1100" height="721.5" role="img" aria-labelledby="title desc">
<title id="title">Crux: the effect router</title>
<desc id="desc">The Rust shared crate holds an EffectRouter, which holds the Core and a routing closure. The Core runs the app, and the app does not change. The Core gives each effect and each follow-up effect to the routing closure. The routing closure sends each effect to a route of your own. A Rust handler resolves its requests itself, next to the core. The Serialized lane sends bytes to the shell's EffectHandler, which is the usual serialized interface. The Parked lane sends the typed operation to a custom FFI of your own design. Each output goes back to the Core along one line, and the Core sends the follow-up effects to the routing closure again.</desc>
