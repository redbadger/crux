<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 545" width="960" height="545" role="img" aria-labelledby="title desc">
<title id="title">Crux architecture</title>
<desc id="desc">The shell holds the UI and the effect handlers. The core holds the app's update and view functions, the Model and the Commands. The shell sends events to the core. The core gives the shell zero or more effects. The UI asks the core for the view when it receives a Render effect, and it draws the ViewModel. The effect handlers run the other effects and return each Output to the core.</desc>
<style>
text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1a1a1a; }
.m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
.h { font-size: 18px; font-weight: 700; fill: #8a8a8a; }
.b { font-size: 16px; font-weight: 600; }
.s { font-size: 12px; }
.l { font-size: 12.5px; }
.ln { stroke: #8a8a8a; stroke-width: 2; fill: none; }
.dash { stroke-dasharray: 6 5; }
.pill { fill: #f2f2f2; stroke: #c4c4c4; stroke-width: 1; }
@media (prefers-color-scheme: dark) {
  .h { fill: #a8a8a8; }
}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/>
</marker>
</defs>
<rect x="15" y="15" width="930" height="515" rx="14" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-width="1.5"/>
<text x="35" y="44" text-anchor="start" class="h">Shell</text>
<rect x="480" y="28" width="450" height="492" rx="14" fill="#22c55e" fill-opacity="0.08" stroke="#22c55e" stroke-width="1.5"/>
<text x="498" y="57" text-anchor="start" class="h">Core</text>
<rect x="50" y="80" width="180" height="190" rx="10" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="98" y="165" text-anchor="middle" class="b">UI</text>
<text x="98" y="185" text-anchor="middle" class="s">sends events,</text>
<text x="98" y="201" text-anchor="middle" class="s">draws the view</text>
<path d="M162,266 V120 Q162,102,180,102 H230" class="ln dash" style="stroke-width:1.5"/>
<rect x="62" y="437" width="180" height="64" rx="10" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.5"/>
<rect x="56" y="431" width="180" height="64" rx="10" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.5"/>
<rect x="50" y="425" width="180" height="64" rx="10" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="140" y="454" text-anchor="middle" class="b">Effect handlers</text>
<text x="140" y="472" text-anchor="middle" class="s">HTTP, storage, time, …</text>
<rect x="510" y="80" width="200" height="70" rx="10" fill="#bbf7d0" stroke="#22c55e" stroke-width="1.5"/>
<text x="610" y="120.5" text-anchor="middle" class="b m">App::view</text>
<rect x="510" y="200" width="200" height="70" rx="10" fill="#bbf7d0" stroke="#22c55e" stroke-width="1.5"/>
<text x="610" y="240.5" text-anchor="middle" class="b m">App::update</text>
<rect x="510" y="340" width="200" height="70" rx="10" fill="#ddd6fe" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="610" y="380.5" text-anchor="middle" class="b m" style="font-size:13.5px">Command&lt;Effect, Event&gt;</text>
<rect x="810" y="80" width="100" height="190" rx="10" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
<text x="860" y="180.5" text-anchor="middle" class="b">Model</text>
<path d="M810,115 H712" class="ln" marker-end="url(#a)"/>
<rect x="733.4" y="89" width="53.2" height="22" rx="11" class="pill"/>
<text x="760" y="104.3" text-anchor="middle" class="l">reads</text>
<path d="M712,235 H808" class="ln" marker-end="url(#a)" marker-start="url(#a)"/>
<rect x="726" y="209" width="68.1" height="22" rx="11" class="pill"/>
<text x="760" y="224.3" text-anchor="middle" class="l">changes</text>
<path d="M570,272 V338" class="ln" marker-end="url(#a)"/>
<rect x="492" y="294" width="68.1" height="22" rx="11" class="pill"/>
<text x="526" y="309.3" text-anchor="middle" class="l">returns</text>
<path d="M650,338 V272" class="ln dash" marker-end="url(#a)"/>
<text x="638" y="290" text-anchor="end" class="s m" style="fill:#8a8a8a;font-weight:600">0..n</text>
<rect x="662.2" y="302" width="127.6" height="22" rx="11" class="pill"/>
<text x="726" y="317.3" text-anchor="middle" class="l">follow-up Event</text>
<path d="M232,102 H508" class="ln" marker-end="url(#a)"/>
<rect x="327.1" y="76.8" width="85.8" height="22.5" rx="11.2" class="pill"/>
<text x="370" y="92.5" text-anchor="middle" class="l">on Render</text>
<path d="M508,130 H232" class="ln" marker-end="url(#a)"/>
<rect x="327.1" y="132.8" width="85.8" height="22.5" rx="11.2" class="pill"/>
<text x="370" y="148.5" text-anchor="middle" class="l m">ViewModel</text>
<path d="M232,235 H508" class="ln" marker-end="url(#a)"/>
<rect x="342.6" y="209.8" width="54.8" height="22.5" rx="11.2" class="pill"/>
<text x="370" y="225.5" text-anchor="middle" class="l m">Event</text>
<path d="M508,362 H240" class="ln"/>
<text x="472" y="380" text-anchor="end" class="s m" style="fill:#8a8a8a;font-weight:600">0..n</text>
<rect x="338.8" y="336.8" width="62.5" height="22.5" rx="11.2" class="pill"/>
<text x="370" y="352.5" text-anchor="middle" class="l m">Effect</text>
<path d="M240,362 C162,362,162,362,162,317 V272" class="ln" marker-end="url(#a)"/>
<rect x="82.8" y="286.8" width="62.5" height="22.5" rx="11.2" class="pill"/>
<text x="114" y="302.5" text-anchor="middle" class="l m">Render</text>
<path d="M240,362 C140,362,140,362,140,412 V423" class="ln" marker-end="url(#a)"/>
<path d="M244,461 H490 C550,461,550,461,550,421 V412" class="ln" marker-end="url(#a)"/>
<rect x="338.8" y="435.8" width="62.5" height="22.5" rx="11.2" class="pill"/>
<text x="370" y="451.5" text-anchor="middle" class="l m">Output</text>
</svg>
