<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 538" width="800" height="538" role="img" aria-labelledby="title desc">
<title id="title">Crux: the app layers at run time and in a test</title>
<desc id="desc">Two columns of layers. At runtime, from the top: the app core, the shell's effect handler, an HTTP client, the network, an HTTP server and the server logic. In a test, from the top: the same app core, an effect handler for the test, and a simplified version of the server logic. An arrow labelled unchanged goes from the app core at run time to the app core in the test. An arrow labelled test version goes from the shell's effect handler to the test's effect handler. The HTTP client, the network and the HTTP server have dashed outlines, in a group labelled not in tests. An arrow labelled in-process fake goes from the server logic to the simplified server logic, which runs in the test process.</desc>
<style>
text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1a1a1a; }
.m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-variant-ligatures: none; }
.h { font-size: 18px; font-weight: 700; fill: #8a8a8a; }
.b { font-size: 16px; font-weight: 600; }
.s { font-size: 12px; }
.l { font-size: 12.5px; }
.ln { stroke: #8a8a8a; stroke-width: 2; fill: none; }
.dash { stroke-dasharray: 6 5; }
.pill { fill: #f2f2f2; stroke: #c4c4c4; stroke-width: 1; }
@media (prefers-color-scheme: dark) {
  .h { fill: #a8a8a8; }
}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/>
</marker>
</defs>
<text x="165" y="40" text-anchor="middle" class="h">At runtime</text>
<text x="635" y="40" text-anchor="middle" class="h">In tests</text>
<rect x="30" y="64" width="270" height="56" rx="10" fill="#bbf7d0" stroke="#22c55e" stroke-width="1.5"/>
<text x="165" y="97.8" text-anchor="middle" class="b">App core</text>
<rect x="30" y="134" width="270" height="56" rx="10" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="165" y="167.8" text-anchor="middle" class="b">Effect handler (shell)</text>
<rect x="18" y="204" width="294" height="244" rx="14" fill="#9ca3af" fill-opacity="0.08" stroke="#9ca3af" stroke-width="1.5"/>
<text x="36" y="231" text-anchor="start" class="s" style="fill:#8a8a8a;font-size:15px;font-weight:600">Transport (not in tests)</text>
<rect x="30" y="240" width="270" height="56" rx="10" fill="#e5e7eb" stroke="#6b7280" stroke-width="2" stroke-dasharray="8 5"/>
<text x="165" y="273.5" text-anchor="middle" class="b">HTTP client</text>
<rect x="30" y="310" width="270" height="56" rx="10" fill="#e5e7eb" stroke="#6b7280" stroke-width="2" stroke-dasharray="8 5"/>
<text x="165" y="343.5" text-anchor="middle" class="b">Network</text>
<rect x="30" y="380" width="270" height="56" rx="10" fill="#e5e7eb" stroke="#6b7280" stroke-width="2" stroke-dasharray="8 5"/>
<text x="165" y="413.5" text-anchor="middle" class="b">HTTP server</text>
<rect x="30" y="462" width="270" height="56" rx="10" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
<text x="165" y="495.8" text-anchor="middle" class="b">Server logic</text>
<rect x="500" y="64" width="270" height="56" rx="10" fill="#bbf7d0" stroke="#22c55e" stroke-width="1.5"/>
<text x="635" y="97.8" text-anchor="middle" class="b">App core</text>
<rect x="500" y="134" width="270" height="56" rx="10" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="635" y="167.8" text-anchor="middle" class="b">Effect handler (test)</text>
<rect x="500" y="204" width="270" height="56" rx="10" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
<text x="635" y="237.8" text-anchor="middle" class="b">Simplified server logic</text>
<path d="M302,92 H498" class="ln" marker-end="url(#a)"/>
<rect x="357.1" y="66.8" width="85.8" height="22.5" rx="11.2" class="pill"/>
<text x="400" y="82.5" text-anchor="middle" class="l">unchanged</text>
<path d="M302,162 H498" class="ln" marker-end="url(#a)"/>
<rect x="345.5" y="136.8" width="109" height="22.5" rx="11.2" class="pill"/>
<text x="400" y="152.5" text-anchor="middle" class="l">test version</text>
<path d="M302,490 H384 Q400,490,400,474 V248 Q400,232,416,232 H498" class="ln" marker-end="url(#a)"/>
<rect x="333.9" y="349.8" width="132.2" height="22.5" rx="11.2" class="pill"/>
<text x="400" y="365.5" text-anchor="middle" class="l">in-process fake</text>
</svg>
