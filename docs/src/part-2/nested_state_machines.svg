<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 716" width="960" height="716" role="img" aria-labelledby="title desc">
<title id="title">Crux: events go down the model tree, and transitions come back up</title>
<desc id="desc">The Active branch of the weather app's model tree. The Model group holds the Active and Onboard states. Active holds an ActiveModel. Its screen is Screen::Home, which holds a HomeScreen. The HomeScreen holds two children, LocalWeather and Vec&lt;FavoriteWeather&gt;. Solid arrows take events down from each parent to its child: Event::Active, ActiveEvent::Home, HomeEvent::Local and HomeEvent::FavoritesWeather. Dashed arrows take transitions back up in the Outcome that update returns: LocalWeatherTransition::Unauthorized and FavoriteWeatherTransition::Unauthorized go to HomeScreen, HomeTransition::ApiKeyRejected goes to ActiveModel, and ActiveTransition::Unauthorized goes to Active. Then update_active changes the Model from Active back to Onboard. Each parent uses map_event to wrap the events of its child in its own variant.</desc>
<style>
text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1a1a1a; }
.m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-variant-ligatures: none; }
.h { font-size: 18px; font-weight: 700; fill: #8a8a8a; }
.b { font-size: 16px; font-weight: 600; }
.s { font-size: 12px; }
.l { font-size: 12.5px; }
.ln { stroke: #8a8a8a; stroke-width: 2; fill: none; }
.dash { stroke-dasharray: 6 5; }
.pill { fill: #f2f2f2; stroke: #c4c4c4; stroke-width: 1; }
@media (prefers-color-scheme: dark) {
  .h { fill: #a8a8a8; }
}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/>
</marker>
</defs>
<rect x="15" y="15" width="930" height="145" rx="14" fill="#d97706" fill-opacity="0.08" stroke="#d97706" stroke-width="1.5"/>
<text x="33" y="42" text-anchor="start" class="s m" style="fill:#8a8a8a;font-size:15px;font-weight:600">Model</text>
<rect x="160" y="60" width="320" height="56" rx="10" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
<text x="320" y="85.3" text-anchor="middle" class="b m">Active</text>
<text x="320" y="103.3" text-anchor="middle" class="s">home and favourites</text>
<rect x="740" y="60" width="190" height="56" rx="10" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
<text x="835" y="85.3" text-anchor="middle" class="b m">Onboard</text>
<text x="835" y="103.3" text-anchor="middle" class="s">asks for an API key</text>
<rect x="160" y="282" width="320" height="56" rx="10" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
<text x="320" y="307.3" text-anchor="middle" class="b m">ActiveModel</text>
<text x="320" y="325.3" text-anchor="middle" class="s m">screen: Screen::Home</text>
<rect x="30" y="460" width="900" height="56" rx="10" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
<text x="480" y="485.3" text-anchor="middle" class="b m">HomeScreen</text>
<text x="480" y="503.3" text-anchor="middle" class="s">two sub-workflows that run in parallel</text>
<rect x="30" y="638" width="450" height="56" rx="10" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
<text x="255" y="663.3" text-anchor="middle" class="b m">LocalWeather</text>
<text x="255" y="681.3" text-anchor="middle" class="s">the weather at the current location</text>
<rect x="520" y="638" width="410" height="56" rx="10" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
<text x="725" y="663.3" text-anchor="middle" class="b m">Vec&lt;FavoriteWeather&gt;</text>
<text x="725" y="681.3" text-anchor="middle" class="s">the weather for each favourite</text>
<path d="M482,88 H738" class="ln" marker-end="url(#a)"/>
<rect x="532.2" y="62.8" width="155.5" height="22.5" rx="11.2" class="pill"/>
<text x="610" y="78.5" text-anchor="middle" class="l">back to onboarding</text>
<path d="M240,118 V280" class="ln" marker-end="url(#a)"/>
<rect x="181.6" y="208.8" width="116.8" height="22.5" rx="11" class="pill"/>
<text x="240" y="224.5" text-anchor="middle" class="l m">Event::Active</text>
<path d="M416,280 V118" class="ln dash" marker-end="url(#a)"/>
<rect x="338.2" y="201" width="155.5" height="38" rx="11" class="pill"/>
<text x="416" y="217" text-anchor="middle" class="l m">ActiveTransition::</text>
<text x="416" y="232" text-anchor="middle" class="l m">Unauthorized</text>
<path d="M240,340 V458" class="ln" marker-end="url(#a)"/>
<rect x="166.1" y="387.8" width="147.8" height="22.5" rx="11" class="pill"/>
<text x="240" y="403.5" text-anchor="middle" class="l m">ActiveEvent::Home</text>
<path d="M416,458 V340" class="ln dash" marker-end="url(#a)"/>
<rect x="346" y="380" width="140" height="38" rx="11" class="pill"/>
<text x="416" y="396" text-anchor="middle" class="l m">HomeTransition::</text>
<text x="416" y="411" text-anchor="middle" class="l m">ApiKeyRejected</text>
<path d="M120,518 V636" class="ln" marker-end="url(#a)"/>
<rect x="50" y="565.8" width="140" height="22.5" rx="11" class="pill"/>
<text x="120" y="581.5" text-anchor="middle" class="l m">HomeEvent::Local</text>
<path d="M340,636 V518" class="ln dash" marker-end="url(#a)"/>
<rect x="239" y="558" width="202" height="38" rx="11" class="pill"/>
<text x="340" y="574" text-anchor="middle" class="l m">LocalWeatherTransition::</text>
<text x="340" y="589" text-anchor="middle" class="l m">Unauthorized</text>
<path d="M560,518 V636" class="ln" marker-end="url(#a)"/>
<rect x="490" y="558" width="140" height="38" rx="11" class="pill"/>
<text x="560" y="574" text-anchor="middle" class="l m">HomeEvent::</text>
<text x="560" y="589" text-anchor="middle" class="l m">FavoritesWeather</text>
<path d="M800,636 V518" class="ln dash" marker-end="url(#a)"/>
<rect x="687.4" y="558" width="225.2" height="38" rx="11" class="pill"/>
<text x="800" y="574" text-anchor="middle" class="l m">FavoriteWeatherTransition::</text>
<text x="800" y="589" text-anchor="middle" class="l m">Unauthorized</text>
<path d="M540,292 H584" class="ln" marker-end="url(#a)"/>
<text x="598" y="296" text-anchor="start" class="s" style="fill:#8a8a8a;font-size:13px;font-weight:600" xml:space="preserve">events go down to a child</text>
<path d="M540,320 H584" class="ln dash" marker-end="url(#a)"/>
<text x="598" y="324" text-anchor="start" class="s" style="fill:#8a8a8a;font-size:13px;font-weight:600" xml:space="preserve">transitions come back up in an <tspan class="m">Outcome</tspan></text>
<text x="540" y="352" text-anchor="start" class="s" style="fill:#8a8a8a;font-size:13px;font-weight:600" xml:space="preserve"><tspan class="m">map_event</tspan> wraps a child's events in a variant</text>
</svg>
