<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-labelledby="title desc">
<title id="title">Crux: the two sides of the shell</title>
<desc id="desc">The core is in the centre. It receives events (blue) and requests effects (red) such as Render, Http, KeyValue and Time. The shell surrounds the core. On the driving side, the user works with a UI built in SwiftUI, Jetpack Compose, React, Leptos, Yew, Dioxus or Ratatui. On the driven side, the shell runs the effects against APIs, storage and devices on iOS, macOS, Android, the web, the desktop or the terminal.</desc>
