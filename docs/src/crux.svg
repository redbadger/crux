<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 665" width="960" height="665" role="img" aria-labelledby="title desc">
<title id="title">Crux: the two sides of the shell</title>
<desc id="desc">The Rust core is in the centre and holds the Model. The shell surrounds the core. Events (blue) cross the boundary into the core. Effects (red) such as Render, Http, KeyValue and Time cross the boundary out to the shell. An arrowhead on each tag shows the direction. On the driving side, the user works with a UI built in SwiftUI, Jetpack Compose, React, Leptos, Yew, Dioxus or Ratatui. On the driven side, the shell runs the effects against APIs, storage and devices on iOS, macOS, Android, the web, the desktop or the terminal.</desc>
