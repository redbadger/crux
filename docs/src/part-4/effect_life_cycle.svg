<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 1036" width="980" height="1036" role="img" aria-labelledby="title desc">
<title id="title">Crux: one effect's life cycle</title>
<desc id="desc">A sequence diagram with five lanes: the executor, the task, the effects channel, the core and the shell. Solid arrows are calls and messages, and dashed arrows are return values. The shell calls process_event, and update returns a Command. The core spawns the Command's task and calls run_until_settled, which puts the task on the ready queue and polls it. The task runs to its first .await, where it creates a Request with a resolve callback. The task sends the Effect on the effects channel and returns Pending. The core takes the Effect from the channel and returns it to the shell. The shell runs the effect and calls resolve with the output. The resolve callback sends the output to the task, and the waker puts the task on the ready queue again. The core calls run_until_settled, the executor polls the task, and the task continues to its next .await or to its end. The core returns any new effects to the shell.</desc>
<style>
text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1a1a1a; }
.m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-variant-ligatures: none; }
.h { font-size: 18px; font-weight: 700; fill: #8a8a8a; }
.b { font-size: 16px; font-weight: 600; }
.s { font-size: 12px; }
.l { font-size: 12.5px; }
.ln { stroke: #8a8a8a; stroke-width: 2; fill: none; }
.dash { stroke-dasharray: 6 5; }
.pill { fill: #f2f2f2; stroke: #c4c4c4; stroke-width: 1; }
@media (prefers-color-scheme: dark) {
