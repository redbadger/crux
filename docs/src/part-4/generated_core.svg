<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 675" width="950" height="675" role="img" aria-labelledby="title desc">
<title id="title">Crux: the generated Core</title>
<desc id="desc">The layers of a shell that uses the generated Core, from the UI at the top to the Rust core at the bottom. Purple boxes are generated, blue boxes are the shell's own code, and green boxes are the Rust shared crate. The UI reads the view from Core and calls update with an event. Core serializes the event and calls update on the bridge. The bridge is FfiBridge, which implements CoreBridge over the CoreFfi bindings that BoltFFI generates. Without a BoltFFI config, the shell writes its own CoreBridge. The bytes cross the FFI to CoreFfi in ffi.rs, which wraps Bridge&lt;App&gt; and Core&lt;App&gt;. The requests come back up to Core. Core handles Render itself and gives the other requests to EffectDispatcher. The dispatcher calls a method of the shell's EffectHandler, which returns the output. The dispatcher resolves the request through the bridge, and the new requests come back up to Core.</desc>
<style>
