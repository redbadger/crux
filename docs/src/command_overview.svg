<text x="370.0" y="92.5" text-anchor="middle" class="l m">view() on Render</text>
<path d="M508,130 H232" class="ln" marker-end="url(#a)"/>
<rect x="327.1" y="132.8" width="85.8" height="22.5" rx="11.2" class="pill"/>
<text x="370.0" y="148.5" text-anchor="middle" class="l m">ViewModel</text>
