<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 580" width="1160" height="580" role="img" aria-labelledby="title desc">
<title id="title">Crux: the shell and core round trip</title>
<desc id="desc">The shell calls process_event with an event. App::update changes the Model and returns a Command. The Command can send follow-up events back to update, and it gives zero or more effects to the shell, and each effect carries a request. A Render effect goes to the UI, which calls view and draws the ViewModel. The Command sends the other effects to the shell's effect handlers, and the shell resolves each request with the operation's output. Optionally, the Command sends some effects to Rust handlers in the core, which resolve each request the same way.</desc>
<style>
text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1a1a1a; }
.m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
.h { font-size: 18px; font-weight: 700; fill: #8a8a8a; }
.b { font-size: 16px; font-weight: 600; }
.s { font-size: 12px; }
.l { font-size: 12.5px; }
.ln { stroke: #8a8a8a; stroke-width: 2; fill: none; }
.dash { stroke-dasharray: 6 5; }
.pill { fill: #f2f2f2; stroke: #c4c4c4; stroke-width: 1; }
@media (prefers-color-scheme: dark) {
  .h { fill: #a8a8a8; }
}
</style>
