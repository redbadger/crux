<text x="140.0" y="454.0" text-anchor="middle" class="b">Effect handlers</text>
<text x="140.0" y="472.0" text-anchor="middle" class="s">HTTP, storage, time, …</text>
<rect x="510" y="80" width="200" height="70" rx="10" fill="#bbf7d0" stroke="#22c55e" stroke-width="1.5"/>
<text x="610.0" y="120.5" text-anchor="middle" class="b m">App::view</text>
