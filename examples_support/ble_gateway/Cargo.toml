# The Chrome gateway: a Crux app (core) and its Leptos shell (web).
[workspace]
members = ["core", "web"]
resolver = "3"

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
ble_protocol = { path = "../ble_protocol" }
crux_core = { path = "../../crux_core" }
crux_http = { path = "../../crux_http" }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
