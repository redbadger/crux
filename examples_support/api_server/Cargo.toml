[package]
name = "api_server"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8.9"
futures = "0.3.33"
futures-signals = "0.3.34"
rand = "0.10"
serde = "1.0.229"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.0", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
