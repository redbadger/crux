[package]
name = "crux_core"
version = "0.21.0"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Cross-platform app development in Rust"
readme = "../README.md"
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[package.metadata.docs.rs]
all-features = true

[dependencies]
anyhow = { workspace = true, optional = true }
bincode = { version = "=1.3", optional = true }
crossbeam-channel = { version = "0.5", optional = true }
camino = { version = "1.2", optional = true }
cargo_metadata = { version = "=0.19", optional = true }
uniffi_bindgen = { workspace = true, optional = true }
crux_macros = { version = "0.11.0", path = "../crux_macros", optional = true }
# spike(no_std): not `workspace = true`, because the workspace entry enables facet's default (std) features
facet = { version = "=0.46.5", default-features = false, features = ["alloc"] }
facet_generate = { workspace = true, optional = true }
futures = { version = "0.3", default-features = false, features = ["alloc"] }
heck = { version = "0.5", optional = true }
log = { version = "0.4", optional = true }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", optional = true }
slab = { version = "0.4", default-features = false }
thiserror = { version = "2.0", default-features = false }

[dev-dependencies]
crux_core = { path = ".", features = ["testing"] }
assert_matches = "1.5"
async-channel = "2.5.0"
crux_http = { path = "../crux_http" }
crux_time = { path = "../crux_time" }
doctest_support = { path = "../doctest_support" }
# The `fg::namespace` grammar, so the typegen test can put an operation's output
# in a namespace of its own — which is where the generated Kotlin signature has
# to name it from the module's own package rather than as a bare `Kit.Presence`.
facet-generate-attrs = { workspace = true }
insta = "1"
rand = "0.10"
serde = { workspace = true, features = ["derive"] }
static_assertions = "1.1"
tempfile = "3.27.0"
trybuild = "1"
url = "2.5.8"

[features]
default = ["std", "bridge", "crux_macros"]
std = ["dep:crossbeam-channel", "facet/std", "futures/std", "serde/std", "slab/std", "thiserror/std"]
# The serialising FFI bridge. bincode 1.3 is built on std::io, so std-only for now.
bridge = ["std", "dep:bincode", "dep:serde_json"]
# Deprecated compatibility alias. New binding generation should use BoltFFI directly.
bindgen = ["uniffi_compat_bindgen"]
facet_typegen = [
    "std",
    "crux_macros/facet_typegen",
    "dep:facet_generate",
    "dep:heck",
    "dep:log",
]
testing = ["std", "dep:anyhow"]
uniffi_compat_bindgen = [
    "std",
    "dep:anyhow",
    "dep:camino",
    "dep:cargo_metadata",
    "dep:uniffi_bindgen",
]
