name: build

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: short
  NEXTEST_PROFILE: ci
  CI: 1
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

jobs:
  build:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Remove rust-toolchain.toml
        shell: bash
        run: |
          # so we don't add tooling for all targets
          rm rust-toolchain.toml

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, rust-src
          targets: wasm32-unknown-unknown

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Lints
        shell: bash
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets -- --no-deps -Dclippy::pedantic -Dclippy::nursery -Dwarnings

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      # The `shell_protocol` tests of the capability crates, and the typegen
      # tests of `crux_core`, run `dotnet build` over a generated C# package,
      # which the generator targets at `net10.0`. Without this step, nothing
      # compiles the C# protocols. Swift and Node need no step of their own,
      # because the runner image has both.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # The `shell_protocol` tests and the typegen tests compile the generated
      # Kotlin with `kotlinc`, which needs a JRE. The runner image has a JDK
      # and its own Kotlin, but that Kotlin changes with the image. This step
      # installs the pinned release and puts it first on PATH, so a green run
      # tells which compiler agreed. `just check-versions` holds the version
      # to lib.just.
      - name: Install the Kotlin compiler
        shell: bash
        run: |
          set -euxo pipefail
          kotlin_version=2.4.20
          curl -fsSL -o "$RUNNER_TEMP/kotlin-compiler.zip" \
            "https://github.com/JetBrains/kotlin/releases/download/v${kotlin_version}/kotlin-compiler-${kotlin_version}.zip"
          unzip -q "$RUNNER_TEMP/kotlin-compiler.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/kotlinc/bin" >> "$GITHUB_PATH"

      # `kotlinc` has only the standard library, but the generated Kotlin
      # imports kotlinx.coroutines, so the compiler needs the jar on its
      # classpath. Locally, the tests find a jar that Gradle cached. CI has no
      # such cache, so this step fetches the version that the generator writes
      # into build.gradle.kts, and points the tests at it.
      - name: Fetch the kotlinx-coroutines jar
        shell: bash
        run: |
          set -euxo pipefail
          coroutines_version=1.10.2
          jar="$RUNNER_TEMP/kotlinx-coroutines-core-jvm-${coroutines_version}.jar"
          curl -fsSL -o "$jar" \
            "https://repo1.maven.org/maven2/org/jetbrains/kotlinx/kotlinx-coroutines-core-jvm/${coroutines_version}/kotlinx-coroutines-core-jvm-${coroutines_version}.jar"
          echo "KOTLINX_COROUTINES_JAR=$jar" >> "$GITHUB_ENV"

      - name: Build crux
        shell: bash
        run: cargo build --workspace

      - name: Install nextest
        shell: bash
        run: |
          set -euxo pipefail
          curl -LsSf https://get.nexte.st/0.9/linux | tar zxf - -C ${CARGO_HOME:-~/.cargo}/bin

      - name: Tests
        shell: bash
        # Swift, Kotlin, Node and the .NET SDK are all on this job. If a test
        # cannot find one of them, the job is broken, so the test fails and
        # names the tool. Without this variable, the test prints a skip that
        # nobody reads.
        env:
          CRUX_REQUIRE_SHELL_TOOLCHAINS: 1
        run: |
          cargo nextest run --all-features
          cargo test --doc --all-features

      - name: Tests (crux_http with http-types compat feature)
        shell: bash
        run: |
          cargo nextest run -p crux_http --features crux_http/http-types
          cargo test --doc -p crux_http --features crux_http/http-types

      - name: Check crux_http for wasm32-unknown-unknown
        shell: bash
        run: cargo check -p crux_http --target wasm32-unknown-unknown

  # Builds the book (running linkcheck) and checks that every code include
  # names a real file and anchor, which mdBook itself only warns about. The
  # tool versions are held to the ones `pages.yaml` deploys with.
  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: taiki-e/install-action@just

      - name: Setup mdBook
        uses: jontze/action-mdbook@v4
        with:
          token: ${{secrets.GITHUB_TOKEN}}
          mdbook-version: "0.4.52"
          use-linkcheck: true
          use-admonish: true

      - name: Build the book and check its includes
        shell: bash
        run: just docs
