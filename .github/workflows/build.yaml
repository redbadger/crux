name: build

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: short
  NEXTEST_PROFILE: ci
  CI: 1

jobs:
  # Finds whether a pull request can affect the root workspace. On a push to
  # master, `build` always runs. On a pull request, `build` runs unless every
  # changed file is in docs/, in examples/ or in the list of inert files below.
  # `build` is a required check, and GitHub counts a skipped job as a pass. Thus
  # a skipped `build` does not block a merge.
  changes:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest

    outputs:
      build: ${{ steps.select.outputs.build }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select the jobs
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # On a push, or if git cannot list the changed files, every job runs.
          changed="$RUNNER_TEMP/changed.txt"
          : > "$changed"
          all=true
          if [ "$EVENT_NAME" = pull_request ]; then
            if git diff --no-renames --name-only "$BASE_SHA...$HEAD_SHA" > "$changed"; then
              all=false
            else
              echo "::warning::Cannot list the changed files, so every job runs"
            fi
          fi
          echo "Changed files:"
          cat "$changed"

          jq -n -r --argjson all "$all" --rawfile changed "$changed" '
            # Files that the root workspace does not use.
            def inert:
              startswith("docs/") or startswith("examples/") or startswith(".vscode/")
              or IN("README.md", "CONTRIBUTING.md", "CODE_OF_CONDUCT.md", "LICENSE",
                    "release.md", "renovate.json", ".gitignore", ".gitattributes");

            ($changed | split("\n") | map(select(length > 0))) as $files
            | "build=\($all or any($files[]; inert | not))"
          ' | tee -a "$GITHUB_OUTPUT"

  build:
    needs: changes
    # If `changes` fails, `build` runs, because a skipped `build` passes the
    # required check.
    if: ${{ !cancelled() && needs.changes.result != 'skipped' && (needs.changes.result == 'failure' || needs.changes.outputs.build == 'true') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Remove rust-toolchain.toml
        shell: bash
        run: |
          # so we don't add tooling for all targets
          rm rust-toolchain.toml

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, rust-src
          targets: wasm32-unknown-unknown

      - uses: ./.github/actions/kache
        with:
          manifest-key: ${{ github.workflow }}-${{ github.job }}-${{ matrix.example || 'root' }}-${{ matrix.shell || '' }}
          bucket: ${{ vars.KACHE_R2_BUCKET }}
          endpoint: ${{ vars.KACHE_R2_ENDPOINT }}
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      - name: Lints
        shell: bash
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets -- --no-deps -Dclippy::pedantic -Dclippy::nursery -Dwarnings

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      # The typegen tests of `crux_core` run `dotnet build` over a generated C#
      # package, which the generator targets at `net10.0`. Without this step,
      # nothing compiles the generated C#. Swift and Node need no step of their
      # own, because the runner image has both.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # The typegen tests compile the generated Kotlin with `kotlinc`, which
      # needs a JRE. The runner image has a JDK and its own Kotlin, but that
      # Kotlin changes with the image. This step installs the pinned release
      # and puts it first on PATH, so a green run tells which compiler agreed.
      # `just check-versions` holds the version to lib.just.
      - name: Install the Kotlin compiler
        shell: bash
        run: |
          set -euxo pipefail
          kotlin_version=2.4.20
          curl -fsSL -o "$RUNNER_TEMP/kotlin-compiler.zip" \
            "https://github.com/JetBrains/kotlin/releases/download/v${kotlin_version}/kotlin-compiler-${kotlin_version}.zip"
          unzip -q "$RUNNER_TEMP/kotlin-compiler.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/kotlinc/bin" >> "$GITHUB_PATH"

      # `kotlinc` has only the standard library, but the generated Kotlin
      # imports kotlinx.coroutines, so the compiler needs the jar on its
      # classpath. Locally, the tests find a jar that Gradle cached. CI has no
      # such cache, so this step fetches the version that the generator writes
      # into build.gradle.kts, and points the tests at it.
      - name: Fetch the kotlinx-coroutines jar
        shell: bash
        run: |
          set -euxo pipefail
          coroutines_version=1.10.2
          jar="$RUNNER_TEMP/kotlinx-coroutines-core-jvm-${coroutines_version}.jar"
          curl -fsSL -o "$jar" \
            "https://repo1.maven.org/maven2/org/jetbrains/kotlinx/kotlinx-coroutines-core-jvm/${coroutines_version}/kotlinx-coroutines-core-jvm-${coroutines_version}.jar"
          echo "KOTLINX_COROUTINES_JAR=$jar" >> "$GITHUB_ENV"

      - name: Build crux
        shell: bash
        run: cargo build --workspace

      - name: Install nextest
        shell: bash
        run: |
          set -euxo pipefail
          curl -LsSf https://get.nexte.st/0.9/linux | tar zxf - -C ${CARGO_HOME:-~/.cargo}/bin

      - name: Tests
        shell: bash
        # Swift, Kotlin, Node and the .NET SDK are all on this job. If a test
        # cannot find one of them, the job is broken, so the test fails and
        # names the tool. Without this variable, the test prints a skip that
        # nobody reads.
        env:
          CRUX_REQUIRE_SHELL_TOOLCHAINS: 1
        run: |
          cargo nextest run --all-features
          cargo test --doc --all-features

      - name: Tests (crux_http with http-types compat feature)
        shell: bash
        run: |
          cargo nextest run -p crux_http --features crux_http/http-types
          cargo test --doc -p crux_http --features crux_http/http-types

      - name: Check crux_http for wasm32-unknown-unknown
        shell: bash
        run: cargo check -p crux_http --target wasm32-unknown-unknown

  # Builds the book (running linkcheck) and checks that every code include
  # names a real file and anchor, which mdBook itself only warns about. The
  # tool versions are held to the ones `pages.yaml` deploys with.
  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: taiki-e/install-action@just

      - name: Setup mdBook
        uses: jontze/action-mdbook@v4
        with:
          token: ${{secrets.GITHUB_TOKEN}}
          mdbook-version: "0.4.52"
          use-linkcheck: true
          use-admonish: true

      - name: Build the book and check its includes
        shell: bash
        run: just docs
