name: pages
on:
  push:
    branches:
      - master

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTFLAGS: "-D warnings"
  RUSTUP_MAX_RETRIES: 10

jobs:
  build:
    if: github.repository == 'redbadger/crux'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (latest)
        uses: actions/checkout@v6
        with:
          path: latest
          fetch-tags: true

      - name: Resolve and verify stable ref
        id: stable_ref
        working-directory: latest
        run: |
          ref=$(cat docs/STABLE_REF)
          git rev-parse --verify "${ref}^{commit}"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout (stable)
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.stable_ref.outputs.ref }}
          path: stable

      - uses: dtolnay/rust-toolchain@stable

      - uses: ./latest/.github/actions/kache
        with:
          manifest-key: ${{ github.workflow }}-${{ github.job }}-${{ matrix.example || 'root' }}-${{ matrix.shell || '' }}
          bucket: ${{ vars.KACHE_R2_BUCKET }}
          endpoint: ${{ vars.KACHE_R2_ENDPOINT }}
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      - name: Setup mdBook
        uses: jontze/action-mdbook@v4
        with:
          token: ${{secrets.GITHUB_TOKEN}}
          mdbook-version: "0.4.52"
          use-linkcheck: true
          use-admonish: true
          use-mermaid: true
          mermaid-version: "~0.14.0"

      - name: Show mdbook version
        run: mdbook --version

      - name: Show linkchecker version
        run: mdbook-linkcheck --version

      - name: Show admonish version
        run: mdbook-admonish --version

      - name: Show mermaid version
        run: mdbook-mermaid --version

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build book (latest)
        working-directory: latest/docs
        run: mdbook build

      - name: Build book (stable)
        working-directory: stable/docs
        run: mdbook build

      - name: Build Documentation (latest)
        working-directory: latest
        run: cargo doc --all --no-deps

      - name: Build Documentation (stable)
        working-directory: stable
        env:
          RUSTFLAGS: -A warnings
        run: cargo doc --all --no-deps

      - name: Move outputs
        run: |
          set -e
          mkdir -p ./public/latest_master
          mv latest/target/doc ./public/latest_master/master_api_docs
          mv latest/docs/book/html/* ./public/latest_master/
          mv stable/target/doc ./public/master_api_docs
          mv stable/docs/book/html/* ./public/

      - name: Upload GitHub Pages artifact
        id: deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

  deploy:
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
