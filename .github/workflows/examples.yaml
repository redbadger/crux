# CI for all example shells (shared, web-leptos, apple, Android, etc.).
#
# Jobs are grouped by platform tooling — not by example — so each job only
# installs the tools its shells need. Within each job a matrix fans out to
# cover every example x shell combination for that platform.
#
# Matrix shape (the full lists are in the `changes` job):
#   shared            7 entries (all 6 examples x shared + counter/tui)
#   web-trunk         6 entries (5 examples x web-leptos + counter/web-yew)
#   web-dioxus        1 entry   (counter only)
#   web-js            7 entries (all 6 examples x web-nextjs + counter/web-react-router)
#   tauri             1 entry   (counter only)
#   windows           1 entry   (counter only)
#   windows-justfiles 1 entry   (counter, no shell: any change in counter selects it)
#   windows-tauri     1 entry   (counter only)
#   windows-android   1 entry   (counter only)
#   apple             5 entries (5 examples, shell is always "apple")
#   android           5 entries (5 examples, shell is always "Android")
#
# On a push to master, every entry runs. On a pull request, the `changes` job
# keeps only the entries that the PR can affect:
#   - A change to a file outside docs/ and examples/<example>/ (for example a
#     root crate, Cargo.lock, lib.just or .github/) selects every entry.
#   - A change in examples/<example>/<shell>/ selects only that shell of that
#     example.
#   - Any other change in examples/<example>/ (for example shared/) selects
#     every shell of that example.
# A job with no entries left is skipped.
#
# Each matrix entry runs: just <shell>/ci  (working dir: examples/<example>)
#
# The windows-justfiles, windows-tauri and windows-android jobs run the
# [windows] variants of the counter recipes on a Windows runner.
name: examples

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: short
  CI: 1

jobs:
  # Selects the matrix entries to run. It gives one JSON list for each matrix
  # job, and true or false for each job with no matrix.
  changes:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest

    outputs:
      shared: ${{ steps.select.outputs.shared }}
      web-trunk: ${{ steps.select.outputs.web-trunk }}
      web-dioxus: ${{ steps.select.outputs.web-dioxus }}
      web-js: ${{ steps.select.outputs.web-js }}
      tauri: ${{ steps.select.outputs.tauri }}
      windows: ${{ steps.select.outputs.windows }}
      windows-justfiles: ${{ steps.select.outputs.windows-justfiles }}
      windows-tauri: ${{ steps.select.outputs.windows-tauri }}
      windows-android: ${{ steps.select.outputs.windows-android }}
      apple: ${{ steps.select.outputs.apple }}
      android: ${{ steps.select.outputs.android }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select the matrix entries
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          JOBS: |
            {
              "shared": [
                { "example": "counter", "shell": "shared" },
                { "example": "counter", "shell": "tui" },
                { "example": "counter-http", "shell": "shared" },
                { "example": "counter-middleware", "shell": "shared" },
                { "example": "counter-routing", "shell": "shared" },
                { "example": "notes", "shell": "shared" },
                { "example": "weather", "shell": "shared" }
              ],
              "web-trunk": [
                { "example": "counter", "shell": "web-leptos" },
                { "example": "counter", "shell": "web-yew" },
                { "example": "counter-http", "shell": "web-leptos" },
                { "example": "counter-middleware", "shell": "web-leptos" },
                { "example": "counter-routing", "shell": "web-leptos" },
                { "example": "weather", "shell": "web-leptos" }
              ],
              "web-dioxus": [
                { "example": "counter", "shell": "web-dioxus" }
              ],
              "web-js": [
                { "example": "counter", "shell": "web-nextjs" },
                { "example": "counter", "shell": "web-react-router" },
                { "example": "counter-http", "shell": "web-nextjs" },
                { "example": "counter-middleware", "shell": "web-nextjs" },
                { "example": "counter-routing", "shell": "web-nextjs" },
                { "example": "notes", "shell": "web-nextjs" },
                { "example": "weather", "shell": "web-nextjs" }
              ],
              "tauri": [
                { "example": "counter", "shell": "tauri" }
              ],
              "windows": [
                { "example": "counter", "shell": "windows" }
              ],
              "windows-justfiles": [
                { "example": "counter" }
              ],
              "windows-tauri": [
                { "example": "counter", "shell": "tauri" }
              ],
              "windows-android": [
                { "example": "counter", "shell": "Android" }
              ],
              "apple": [
                { "example": "counter", "shell": "apple" },
                { "example": "counter-http", "shell": "apple" },
                { "example": "counter-middleware", "shell": "apple" },
                { "example": "counter-routing", "shell": "apple" },
                { "example": "weather", "shell": "apple" }
              ],
              "android": [
                { "example": "counter", "shell": "Android" },
                { "example": "counter-http", "shell": "Android" },
                { "example": "counter-middleware", "shell": "Android" },
                { "example": "counter-routing", "shell": "Android" },
                { "example": "weather", "shell": "Android" }
              ]
            }
        run: |
          set -euo pipefail

          # On a push, or if git cannot list the changed files, every entry runs.
          changed="$RUNNER_TEMP/changed.txt"
          : > "$changed"
          all=true
          if [ "$EVENT_NAME" = pull_request ]; then
            if git diff --no-renames --name-only "$BASE_SHA...$HEAD_SHA" > "$changed"; then
              all=false
            else
              echo "::warning::Cannot list the changed files, so every entry runs"
            fi
          fi
          echo "Changed files:"
          cat "$changed"

          jq -n -r --argjson all "$all" --rawfile changed "$changed" --argjson jobs "$JOBS" '
            # Files that no example uses.
            def inert:
              startswith("docs/") or startswith(".vscode/")
              or IN("README.md", "CONTRIBUTING.md", "CODE_OF_CONDUCT.md", "LICENSE",
                    "release.md", "renovate.json", ".gitignore", ".gitattributes",
                    "examples/README.md");

            # The directories that hold one shell each. shared/ is not in this
            # list, because every shell of the example uses it.
            def shell_dirs:
              ["tui", "web-leptos", "web-yew", "web-dioxus", "web-nextjs",
               "web-react-router", "tauri", "windows", "apple", "Android"];

            # True if a file in $files can affect the matrix entry in the input.
            # An entry with no shell uses every shell of its example.
            def affected($files):
              . as $entry
              | "examples/\($entry.example)/" as $dir
              | any($files[];
                  startswith($dir)
                  and ((ltrimstr($dir) | split("/")) as $parts
                       | if ($parts | length) > 1 and ($parts[0] | IN(shell_dirs[]))
                         then $entry.shell == null or $parts[0] == $entry.shell
                         else true
                         end));

            ($changed | split("\n") | map(select(length > 0))) as $files
            | ($all or any($files[]; (inert or test("^examples/[^/]+/")) | not)) as $everything
            | $jobs
            | to_entries[]
            | .key as $job
            | (.value | map(select($everything or affected($files)))) as $selected
            | if ($job | IN("web-dioxus", "tauri", "windows", "windows-justfiles", "windows-tauri",
                          "windows-android"))
              then "\($job)=\($selected | length > 0)"
              else "\($job)=\($selected | tojson)"
              end
          ' | tee -a "$GITHUB_OUTPUT"

  # Rust-only shells (shared + tui). Needs: Rust, wasm32 target, clippy, nextest.
  # All examples have a "shared" shell; only counter has "tui".
  shared:
    needs: changes
    if: needs.changes.outputs.shared != '[]'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.shared) }}

    defaults:
      run:
        working-directory: examples/${{ matrix.example }}

    steps:
      - uses: actions/checkout@v7

      - name: Remove rust-toolchain.toml
        run: rm ../../rust-toolchain.toml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - uses: ./.github/actions/kache
        with:
          manifest-key: ${{ github.workflow }}-${{ github.job }}-${{ matrix.example || 'root' }}-${{ matrix.shell || '' }}
          bucket: ${{ vars.KACHE_R2_BUCKET }}
          endpoint: ${{ vars.KACHE_R2_ENDPOINT }}
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      - uses: taiki-e/install-action@just
      - uses: taiki-e/install-action@nextest

      - name: CI
        run: just ${{ matrix.shell }}/ci

  # WASM shells built with trunk (Leptos, Yew). Needs: Rust, wasm32 target, trunk.
  # All examples have web-leptos; only counter has web-yew.
  web-trunk:
    needs: changes
    if: needs.changes.outputs.web-trunk != '[]'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.web-trunk) }}

    defaults:
      run:
        working-directory: examples/${{ matrix.example }}

    steps:
      - uses: actions/checkout@v7

      - name: Remove rust-toolchain.toml
        run: rm ../../rust-toolchain.toml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - uses: ./.github/actions/kache
        with:
          manifest-key: ${{ github.workflow }}-${{ github.job }}-${{ matrix.example || 'root' }}-${{ matrix.shell || '' }}
          bucket: ${{ vars.KACHE_R2_BUCKET }}
          endpoint: ${{ vars.KACHE_R2_ENDPOINT }}
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      - uses: taiki-e/install-action@just
      - uses: taiki-e/install-action@trunk

      - name: CI
        run: just ${{ matrix.shell }}/ci

  # Dioxus WASM shell. Needs: Rust, wasm32 target, dioxus-cli.
  # Only counter has this shell, so no matrix needed.
  web-dioxus:
    needs: changes
    if: needs.changes.outputs.web-dioxus == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: examples/counter

    steps:
      - uses: actions/checkout@v7

      - name: Remove rust-toolchain.toml
        run: rm ../../rust-toolchain.toml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - uses: ./.github/actions/kache
        with:
          manifest-key: ${{ github.workflow }}-${{ github.job }}-${{ matrix.example || 'root' }}-${{ matrix.shell || '' }}
          bucket: ${{ vars.KACHE_R2_BUCKET }}
          endpoint: ${{ vars.KACHE_R2_ENDPOINT }}
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      - uses: taiki-e/install-action@just
      - uses: taiki-e/install-action@v2
        with:
          tool: dioxus-cli@0.7.7

      # web-dioxus/Justfile clears RUSTC_WRAPPER for `dx build`. Thus kache
      # caches only the `check` recipe here.
      - name: CI
        run: just web-dioxus/ci

  # JS/TS web shells. Needs: Rust, wasm32 target, BoltFFI, Node.js, TypeScript, pnpm.
  # All examples have web-nextjs; only counter has web-react-router.
  web-js:
    needs: changes
    if: needs.changes.outputs.web-js != '[]'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.web-js) }}

    defaults:
      run:
        working-directory: examples/${{ matrix.example }}

    steps:
      - uses: actions/checkout@v7

      - name: Remove rust-toolchain.toml
        run: rm ../../rust-toolchain.toml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: ./.github/actions/kache
        with:
          manifest-key: ${{ github.workflow }}-${{ github.job }}-${{ matrix.example || 'root' }}-${{ matrix.shell || '' }}
          bucket: ${{ vars.KACHE_R2_BUCKET }}
          endpoint: ${{ vars.KACHE_R2_ENDPOINT }}
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      - uses: taiki-e/install-action@just

      - uses: ./.github/actions/install-boltffi
        with:
          version: "0.32.1"

      - name: Install wasm-opt
        run: |
          # BoltFFI 0.32.1 passes --enable-bulk-memory-opt, which was added in Binaryen 123.
          binaryen_version=123
          archive="binaryen-version_${binaryen_version}-x86_64-linux.tar.gz"
          url="https://github.com/WebAssembly/binaryen/releases/download/version_${binaryen_version}/${archive}"
          archive_path="$RUNNER_TEMP/$archive"

          curl --fail --location --retry 3 "$url" --output "$archive_path"
          curl --fail --location --retry 3 "$url.sha256" --output "$archive_path.sha256"
          (cd "$RUNNER_TEMP" && sha256sum --check "$archive.sha256")

          mkdir -p "$RUNNER_TEMP/binaryen"
          tar -xzf "$archive_path" --strip-components=1 -C "$RUNNER_TEMP/binaryen"
          export PATH="$RUNNER_TEMP/binaryen/bin:$PATH"
          echo "$RUNNER_TEMP/binaryen/bin" >> "$GITHUB_PATH"
          wasm-opt --version

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install TypeScript
        # `boltffi pack wasm` runs `tsc` from PATH. The ubuntu-26.04 image has no
        # global `tsc`, so install one.
        run: npm install --global typescript@5.9

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: CI
        run: just ${{ matrix.shell }}/ci

  # Tauri desktop shell. Needs: Rust, Node.js, pnpm, GTK/WebKit system libs.
  # Only counter has this shell, so no matrix needed.
  tauri:
    needs: changes
    if: needs.changes.outputs.tauri == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: examples/counter

    steps:
      - uses: actions/checkout@v7

      # The runner image can download these packages from a slow Ubuntu mirror
      # (12 minutes at 90 kB/s, against 30 s on a good day). The cache keeps the
      # packages that apt downloads, so apt downloads only the packages that
      # changed. A new runner image gets a new key, and the previous key is a
      # fallback, so most packages come from the cache then too.
      #
      # ImageOS and ImageVersion are environment variables of the runner. The
      # `env` context does not contain them, so a step reads them.
      - name: Make the apt cache key
        id: apt-key
        run: |
          prefix="apt-${RUNNER_OS}-${RUNNER_ARCH}-${ImageOS:?}-"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "key=$prefix${ImageVersion:?}" >> "$GITHUB_OUTPUT"

      - name: Restore the apt package cache
        uses: actions/cache@v6
        with:
          path: ~/apt-archives
          key: ${{ steps.apt-key.outputs.key }}
          restore-keys: ${{ steps.apt-key.outputs.prefix }}

      # apt needs root to write `partial/`. After the install, give the
      # directory to the runner user so that the cache can save it, and remove
      # the packages that are no longer available. The `_apt` user cannot open
      # the home directory, so apt downloads as root.
      - name: Install system dependencies
        run: |
          archives="$HOME/apt-archives"
          apt_options=(-o Dir::Cache::Archives="$archives" -o APT::Sandbox::User=root)
          sudo mkdir -p "$archives/partial"
          sudo apt-get update
          sudo apt-get install -y "${apt_options[@]}" \
            libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          sudo apt-get autoclean "${apt_options[@]}"
          sudo rm -rf "$archives/partial" "$archives/lock"
          sudo chown -R "$(id -u):$(id -g)" "$archives"

      - name: Remove rust-toolchain.toml
        run: rm ../../rust-toolchain.toml

      - uses: dtolnay/rust-toolchain@stable

      - uses: ./.github/actions/kache
        with:
          manifest-key: ${{ github.workflow }}-${{ github.job }}-${{ matrix.example || 'root' }}-${{ matrix.shell || '' }}
          bucket: ${{ vars.KACHE_R2_BUCKET }}
          endpoint: ${{ vars.KACHE_R2_ENDPOINT }}
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      - uses: taiki-e/install-action@just

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: CI
        run: just tauri/ci
        env:
          CI: true

  # Windows (WinUI 3) shell. Needs: Windows runner, Rust with the MSVC target,
  # .NET 10 SDK, just, and Visual Studio (pre-installed on windows-latest,
  # resolved via vswhere). Only counter has this shell, so no matrix needed.
  windows:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest

    env:
      BOLTFFI_OVERLAY: ${{ github.workspace }}/.github/boltffi-ci.toml

    defaults:
      run:
        working-directory: examples/counter

    steps:
      - uses: actions/checkout@v7

      - name: Remove rust-toolchain.toml
        run: rm ../../rust-toolchain.toml
        shell: bash

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy, rustfmt

      - uses: ./.github/actions/kache
        with:
          manifest-key: ${{ github.workflow }}-${{ github.job }}-${{ matrix.example || 'root' }}-${{ matrix.shell || '' }}
          bucket: ${{ vars.KACHE_R2_BUCKET }}
          endpoint: ${{ vars.KACHE_R2_ENDPOINT }}
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          # The README of kache-action recommends this on GitHub-hosted Windows
          # runners, because there the home and workspace directories are on
          # different volumes.
          cache-dir: ${{ runner.temp }}/kache
      - uses: taiki-e/install-action@just

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - uses: ./.github/actions/install-boltffi
        with:
          version: "0.32.1"

      - name: CI
        run: just windows/ci

  # The [windows] recipe variants of the counter Justfiles. Needs: Windows
  # runner, Rust and just. The `windows` job above builds only the WinUI 3
  # shell, so without this job nothing runs the other [windows] recipes.
  # This job compiles nothing, so it does not use kache.
  windows-justfiles:
    needs: changes
    if: needs.changes.outputs.windows-justfiles == 'true'
    runs-on: windows-latest

    defaults:
      run:
        working-directory: examples/counter

    steps:
      - uses: actions/checkout@v7

      - name: Remove rust-toolchain.toml
        run: rm ../../rust-toolchain.toml
        shell: bash

      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@just

      # PowerShell 5.1 decodes a BOM-less .ps1 using the legacy ANSI codepage,
      # so a [script('powershell')] body containing ✓ / ✗ / — comes out as
      # mojibake. `chcp 65001` does not help: the parser uses GetACP(), not the
      # console codepage. The lib.just helpers avoid this by running as plain
      # recipes under windows-shell, where just passes the recipe as a process
      # argument instead of a temp file. This guards that.
      - name: doctor output is not mangled
        shell: pwsh
        run: |
          $out = just Android/doctor 2>&1 | Out-String
          Write-Host $out
          if ($out -match 'Ã|â€|ï¿½') { throw "mojibake in doctor output" }
          if ($out -notmatch '[✓✗]') { throw "no check marks in doctor output" }

      # The bash recipes run under `set -euo pipefail`. Their PowerShell twins
      # need an explicit $LASTEXITCODE check, or a mid-loop failure is silently
      # swallowed and the recipe exits 0. Two entries with the failing one
      # FIRST is what discriminates: with a single entry the failure is also
      # the last command, so a broken recipe would pass this by accident.
      - name: aggregate recipes fail when a child fails
        shell: pwsh
        run: |
          foreach ($recipe in 'fix', 'check', 'ci', 'clean') {
            just subprojects="nope shared" $recipe *> $null
            if ($LASTEXITCODE -eq 0) { throw "$recipe swallowed a child failure" }
            Write-Host "  ok: $recipe propagated (exit $LASTEXITCODE)"
          }
          # $LASTEXITCODE is still non-zero from the last injected failure, and
          # GitHub's pwsh wrapper would propagate it as the step's status.
          exit 0

  # Tauri desktop shell on Windows. Needs: Windows runner, Rust, Node.js and
  # pnpm. The windows-latest image has the WebView2 runtime, so this job
  # installs no system libraries. Only counter has this shell, so no matrix
  # needed.
  windows-tauri:
    needs: changes
    if: needs.changes.outputs.windows-tauri == 'true'
    runs-on: windows-latest

    defaults:
      run:
        working-directory: examples/counter

    steps:
      - uses: actions/checkout@v7

      - name: Remove rust-toolchain.toml
        run: rm ../../rust-toolchain.toml
        shell: bash

      - uses: dtolnay/rust-toolchain@stable

      - uses: ./.github/actions/kache
        with:
          manifest-key: ${{ github.workflow }}-${{ github.job }}-${{ matrix.example || 'root' }}-${{ matrix.shell || '' }}
          bucket: ${{ vars.KACHE_R2_BUCKET }}
          endpoint: ${{ vars.KACHE_R2_ENDPOINT }}
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          # The README of kache-action recommends this on GitHub-hosted Windows
          # runners, because there the home and workspace directories are on
          # different volumes.
          cache-dir: ${{ runner.temp }}/kache
      - uses: taiki-e/install-action@just

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: CI
        run: just tauri/ci
        env:
          CI: true

  # The Android shell of counter on Windows. Needs: Windows runner, Rust with
  # Android NDK targets, BoltFFI, JDK 17 and the Android SDK. It runs the
  # [windows] variants of the Android recipes, and Gradle through gradlew.bat.
  # Only counter runs here, so no matrix needed.
  windows-android:
    needs: changes
    if: needs.changes.outputs.windows-android == 'true'
    runs-on: windows-latest

    env:
      BOLTFFI_OVERLAY: ${{ github.workspace }}/.github/boltffi-ci.toml

    defaults:
      run:
        working-directory: examples/counter

    steps:
      - uses: actions/checkout@v7

      - name: Remove rust-toolchain.toml
        run: rm ../../rust-toolchain.toml
        shell: bash

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: ./.github/actions/kache
        with:
          manifest-key: ${{ github.workflow }}-${{ github.job }}-${{ matrix.example || 'root' }}-${{ matrix.shell || '' }}
          bucket: ${{ vars.KACHE_R2_BUCKET }}
          endpoint: ${{ vars.KACHE_R2_ENDPOINT }}
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          # The README of kache-action recommends this on GitHub-hosted Windows
          # runners, because there the home and workspace directories are on
          # different volumes.
          cache-dir: ${{ runner.temp }}/kache
      - uses: taiki-e/install-action@just

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # Caches the Gradle home. Only master writes the cache, and pull requests
      # read it.
      - uses: gradle/actions/setup-gradle@v6
        with:
          # The default provider (`enhanced`) is closed source and requires
          # the Gradle Terms of Use. The `basic` provider is open source.
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - uses: android-actions/setup-android@v4
        with:
          # The obsolete `tools` package (part of the action's default) was
          # removed from Google's SDK repository, so installing it now fails.
          packages: platform-tools

      - uses: ./.github/actions/install-boltffi
        with:
          version: "0.32.1"

      - name: CI
        run: just Android/ci

  # Apple (iOS/macOS) shells. Needs: macOS runner, Rust with Apple targets,
  # BoltFFI, xcodegen, swiftlint. The shell is always "apple", so the job name
  # gives only the example.
  apple:
    name: apple (${{ matrix.example }})
    needs: changes
    if: needs.changes.outputs.apple != '[]'
    runs-on: macos-26

    env:
      BOLTFFI_OVERLAY: ${{ github.workspace }}/.github/boltffi-ci.toml

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.apple) }}

    defaults:
      run:
        working-directory: examples/${{ matrix.example }}

    steps:
      - uses: actions/checkout@v7

      - name: Remove rust-toolchain.toml
        run: rm ../../rust-toolchain.toml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-darwin,x86_64-apple-ios
          components: clippy, rustfmt

      - uses: ./.github/actions/kache
        with:
          manifest-key: ${{ github.workflow }}-${{ github.job }}-${{ matrix.example || 'root' }}-${{ matrix.shell || '' }}
          bucket: ${{ vars.KACHE_R2_BUCKET }}
          endpoint: ${{ vars.KACHE_R2_ENDPOINT }}
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      # macos-26 ships Xcode 26.5 but defaults to 26.4.1; use the latest stable.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install tools
        run: brew install just xcodegen swiftlint

      - uses: ./.github/actions/install-boltffi
        with:
          version: "0.32.1"

      - name: CI
        run: just apple/ci

  # Android shells. Needs: Rust with Android NDK targets, BoltFFI, JDK 17, Android SDK.
  # The shell is always "Android" (capital A matches the directory name), so the
  # job name gives only the example.
  android:
    name: android (${{ matrix.example }})
    needs: changes
    if: needs.changes.outputs.android != '[]'
    runs-on: ubuntu-latest

    env:
      BOLTFFI_OVERLAY: ${{ github.workspace }}/.github/boltffi-ci.toml

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.android) }}

    defaults:
      run:
        working-directory: examples/${{ matrix.example }}

    steps:
      - uses: actions/checkout@v7

      - name: Remove rust-toolchain.toml
        run: rm ../../rust-toolchain.toml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: ./.github/actions/kache
        with:
          manifest-key: ${{ github.workflow }}-${{ github.job }}-${{ matrix.example || 'root' }}-${{ matrix.shell || '' }}
          bucket: ${{ vars.KACHE_R2_BUCKET }}
          endpoint: ${{ vars.KACHE_R2_ENDPOINT }}
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      - uses: taiki-e/install-action@just

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # Caches the Gradle home. Only master writes the cache, and pull requests
      # read it.
      - uses: gradle/actions/setup-gradle@v6
        with:
          # The default provider (`enhanced`) is closed source and requires
          # the Gradle Terms of Use. The `basic` provider is open source.
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - uses: android-actions/setup-android@v4
        with:
          # The obsolete `tools` package (part of the action's default) was
          # removed from Google's SDK repository, so installing it now fails.
          packages: platform-tools

      - uses: ./.github/actions/install-boltffi
        with:
          version: "0.32.1"

      - name: CI
        run: just Android/ci
